{% extends "base.html" %}
{% block title %}Register | Pharmacityville{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-6">
    <div class="card border-0 shadow-sm"><div class="card-body p-4">
      <h1 class="h3 mb-4">Create a customer account</h1>
      <form method="post" action="{{ url_for('auth.register') }}">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label for="name" class="form-label">Full name</label>
          <input id="name" name="name" class="form-control" maxlength="100" value="{{ form_data.get('name', '') }}" required>
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input id="email" name="email" type="email" class="form-control" maxlength="120" value="{{ form_data.get('email', '') }}" required>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password (at least 8 characters)</label>
          <input id="password" name="password" type="password" minlength="8" class="form-control" autocomplete="new-password" required>
        </div>
        <div class="mb-3">
          <label for="confirm_password" class="form-label">Confirm password</label>
          <input id="confirm_password" name="confirm_password" type="password" minlength="8" class="form-control" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn btn-success w-100">Register</button>
      </form>
      <p class="mt-3 mb-0">Already registered? <a href="{{ url_for('auth.login') }}">Log in</a></p>
    </div></div>
  </div>
</div>
{% endblock %}
