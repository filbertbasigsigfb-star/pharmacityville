{% extends "base.html" %}
{% block title %}Reset password | Pharmacityville{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card border-0 shadow-sm"><div class="card-body p-4">
      <h1 class="h3 mb-3">Set a new password</h1>
      <p class="text-muted">Your new password must be at least 8 characters. This link expires 30 minutes after it was sent.</p>
      <form method="post" action="{{ url_for('password_reset.reset_password', token=token) }}">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label" for="new-password">New password</label>
          <input class="form-control" id="new-password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label" for="confirm-password">Confirm new password</label>
          <input class="form-control" id="confirm-password" name="confirm_password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
        </div>
        <button class="btn btn-success w-100" type="submit">Reset password</button>
      </form>
      <p class="mt-3 mb-0"><a href="{{ url_for('auth.login') }}">Back to login</a></p>
    </div></div>
  </div>
</div>
{% endblock %}
