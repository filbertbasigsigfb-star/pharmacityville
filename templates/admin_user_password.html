{% extends "base.html" %}
{% block title %}Reset User Password | Pharmacityville{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-7">
  <section class="admin-page-intro mb-4">
    <span class="admin-page-kicker">ADMINISTRATION / ACCOUNTS</span>
    <h1 class="admin-page-title">Reset Password</h1>
    <p class="text-muted">Setting a new password for <strong>{{ user.name }}</strong> ({{ user.email }}).</p>
  </section>
  <div class="card border-0 shadow-sm"><div class="card-body p-4">
    <form method="post" action="{{ url_for('admin_users.reset_password', user_id=user.id) }}">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3"><label for="password" class="form-label">New password *</label>
        <input id="password" class="form-control" name="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required></div>
      <div class="mb-4"><label for="confirm_password" class="form-label">Confirm new password *</label>
        <input id="confirm_password" class="form-control" name="confirm_password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required></div>
      <div class="d-flex gap-2"><button class="btn btn-success" type="submit">Save New Password</button>
        <a href="{{ url_for('admin_users.list_users') }}" class="btn btn-outline-secondary">Cancel</a></div>
    </form>
  </div></div>
</div></div>
{% endblock %}
