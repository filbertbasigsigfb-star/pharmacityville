{% extends "base.html" %}
{% block title %}Forgot password | Pharmacityville{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card border-0 shadow-sm"><div class="card-body p-4">
      <h1 class="h3 mb-3">Forgot your password?</h1>
      <p class="text-muted">Enter your account email address. If an enabled account matches it, we'll email you a secure link to reset your password.</p>
      <form method="post" action="{{ url_for('password_reset.forgot_password') }}">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label" for="reset-email">Email address</label>
          <input id="reset-email" name="email" type="email" class="form-control" autocomplete="email" maxlength="120" required autofocus>
        </div>
        <button class="btn btn-success w-100" type="submit">Send password reset link</button>
      </form>
      <p class="mt-3 mb-0"><a href="{{ url_for('auth.login') }}">Back to login</a></p>
    </div></div>
  </div>
</div>
{% endblock %}
