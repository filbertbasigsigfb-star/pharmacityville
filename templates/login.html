{% extends "base.html" %}
{% block title %}Log in | Pharmacityville{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card border-0 shadow-sm"><div class="card-body p-4">
      <h1 class="h3 mb-4">Log in</h1>
      <form method="post" action="{{ url_for('auth.login') }}">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input id="email" name="email" type="email" class="form-control" value="{{ email }}" autocomplete="email" required>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-success w-100">Log in</button>
      </form>
      <p class="mt-3 mb-0">New customer? <a href="{{ url_for('auth.register') }}">Register</a></p>
    </div></div>
  </div>
</div>
{% endblock %}
